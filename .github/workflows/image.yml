name: image

# Builds the broker image and publishes it to GHCR by digest.
#
# GHCR rather than ECR for the trial: the package is public, so ECS pulls it
# with no registry credential and the workflow needs no AWS access at all. A
# client deployment mirrors the digest into their own ECR.
#
# The digest is what matters. A refused apply is signalled by an internal
# Atlantis message rather than a stable error code, so the Terraform modules
# refuse a tag and require `repository@sha256:...`.

on:
  push:
    branches: [main]
    paths:
      - "infra/docker/**"
      - "policies/**"
      - "agent_iac_broker/**"
      - "pyproject.toml"
      - ".github/workflows/image.yml"
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: build and publish
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      # A container repository name must be lowercase, and the owner here is
      # not. Actions has no lowercase expression function, so compute it.
      - name: Compute the image name
        id: name
        run: |
          owner_repo=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${owner_repo}/broker" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile
          push: true
          tags: ${{ steps.name.outputs.image }}:${{ github.sha }}
          # The build runs `conftest verify` on the rule sets, so a broken
          # policy fails here rather than on the first production plan.
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report the digest to pin
        run: |
          echo "### Broker image" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.name.outputs.image }}@${{ steps.push.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  verify:
    name: verify the published image
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Smoke the three things the deployment depends on being inside the
      # image. Each has failed in a way that was invisible until exercised:
      # a policy set that does not parse, a cost gate that does not import,
      # and an Atlantis that silently runs without a gate.
      - name: The rule sets load and their own tests pass
        run: |
          docker run --rm --entrypoint conftest \
            "${{ needs.build.outputs.image }}@${{ needs.build.outputs.digest }}" \
            verify --policy /etc/osf/policies

      - name: The cost gate runs and refuses a missing estimate
        run: |
          set +e
          out=$(docker run --rm --entrypoint agent-iac-cost-gate \
            "${{ needs.build.outputs.image }}@${{ needs.build.outputs.digest }}" \
            --estimate /nonexistent.json --ceiling-usd 50)
          code=$?
          set -e
          echo "$out"
          test "$code" = "1" || { echo "expected exit 1 for a missing estimate, got $code" >&2; exit 1; }

      - name: OpenTofu is the distribution, not Terraform
        run: |
          docker run --rm --entrypoint tofu \
            "${{ needs.build.outputs.image }}@${{ needs.build.outputs.digest }}" version
