[project]
name = "agent-iac-broker"
version = "0.0.0"
description = "Policy sets, cost gate, and Terraform modules for a gated infrastructure-apply pipeline (Open Software Factory)."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "boto3>=1.34",
]

[project.scripts]
agent-iac-cost-gate = "agent_iac_broker.cost_gate:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "boto3-stubs[dynamodb,s3]>=1.34",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_iac_broker"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
